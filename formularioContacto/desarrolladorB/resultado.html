<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados del Registro - Desarrollo A</title>
    <link rel="stylesheet" href="../../styles.css">
</head>

<body>

    <main>
        <h1>Datos Recibidos</h1>
        <p>A continuación se detallan los datos ingresados en el formulario de registro:</p>

        <section class="resultado-datos">
            <div class="dato-grupo">
                <strong>Nombre completo:</strong>
                <span id="dato-nombre">Cargando...</span>
            </div>

            <div class="dato-grupo">
                <strong>E-mail:</strong>
                <span id="dato-email">Cargando...</span>
            </div>

            <div class="dato-grupo">
                <strong>Edad:</strong>
                <span id="dato-edad">Cargando...</span>
            </div>

            <div class="dato-grupo">
                <strong>País:</strong>
                <span id="dato-pais">Cargando...</span>
            </div>

            <div class="dato-grupo">
                <strong>Términos y condiciones:</strong>
                <span id="dato-terminos">Cargando...</span>
            </div>
        </section><br>

        <div class="acciones">
            <button onclick="window.history.back();" class="button">Volver al formulario</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Desarrollo A. Todos los derechos reservados.</p>
    </footer>

    <script src="./gestionarDatos.js"></script>
</body>

</html>
