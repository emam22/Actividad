<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro - Desarrollo A</title>
    <link href="../form.css" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
</head>

<body>
    <nav>
        <ul>
            <li class="button"> <a href="../homeForm.html"> HOME </a></li> 
        </ul>
    </nav>
    <main>
        <section class="formulario">
            <form class="form" id="form-contact" action="/formularioContacto/desarrolladorB/resultado.html" method="GET">

                <div class="input">
                    <label for="nombre">Nombre completo: <span>(*)</span></label>
                    <input type="text" id="nombre" name="nombre" placeholder="Mínimo 5 caracteres">
                <span class="mensajeAlerta" id="error-nombre"></span>
                </div>

                <div class="input">
                    <label for="email">E-mail: <span>(*)</span></label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com">
                   <span class="mensajeAlerta" id="error-email"></span>
                </div>

                <div class="input">
                    <label for="edad">Edad: <span>(*)</span></label>
                    <input type="number" id="edad" name="edad" placeholder="Entre 18 y 60 años">
                    <span class="mensajeAlerta" id="error-edad"></span>

                </div>

                <div class="input">
                    <label for="pais">País: <span>(*)</span></label>
                    <select id="pais" name="pais">
                        <option value="" selected disabled>Selecciona tu país</option>
                        <option value="Alemania">Alemania</option>
                        <option value="Argentina">Argentina</option>
                        <option value="Brasil">Brasil</option>
                        <option value="Colombia">Colombia</option>
                        <option value="España">España</option>
                        <option value="Estados Unidos">Estados Unidos</option>
                        <option value="México">México</option>
                        <option value="Uruguay">Uruguay</option>
                        <option value="Portugal">Portugal</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <span class="mensajeAlerta" id="error-pais"></span>

                </div>

                <div class="checkbox">
                    <input type="checkbox" id="terminos" name="terminos" value="aceptado">
                    <label for="terminos">Acepto los terminos y condiciones <span>(*)</span></label>
                </div>
                <span class="mensajeAlerta" id="error-terminos"></span>

                <div class="form-actions">
                    <button type="submit" class="btn-in">Enviar Datos</button>
                    <button type="reset" id="btn-limpiar" class="btn-clear">Limpiar</button>
                </div>
            </form>
        </section>
    </main>

</body>

<script src="../form.js"></script>

</html>
